<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晴旅 · 天气旅行助手</title>
  <link rel="stylesheet" href="/web/styles.css?v=20260907">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="logo"><span class="logo-mark">☼</span><span>晴旅</span></div>
      <button id="new-chat" class="new-chat">＋ 新建会话</button>
      <p class="section-label">最近会话</p>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-note">真实天气数据<br>智能旅行建议</div>
    </aside>
    <section class="workspace">
      <header class="topbar"><div><span class="status-dot"></span>天气旅行助手</div><span id="session-title" class="session-title">新会话</span></header>
      <div id="messages" class="messages">
        <div class="welcome-card"><span class="sun">☀</span><h1>计划一场更从容的旅行</h1><p>告诉我日期和景点，我会查询真实天气，再给你一份可执行的出行建议。</p><div class="quick-actions"><button data-text="后天去颐和园旅游适合吗？">后天去颐和园</button><button data-text="周末去西湖需要带雨具吗？">周末去西湖</button><button data-text="北京今天适合户外活动吗？">北京今日天气</button></div></div>
      </div>
      <form id="chat-form" class="composer"><input id="message" autocomplete="off" placeholder="例如：明天去故宫，穿什么、需要带伞吗？" required><button type="submit">发送 <span>↗</span></button></form>
      <p class="hint">天气数据来自和风天气 · 建议仅供出行参考</p>
    </section>
  </main>
  <script src="/web/app.js?v=20260907"></script>
</body>
</html>
