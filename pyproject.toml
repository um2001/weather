[project]
name = "weather-agent"
version = "0.1.0"
description = "Chinese CLI weather assistant agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "langchain-core>=0.3,<0.4",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2,<1"]
test = ["pytest>=8,<9", "respx>=0.21,<1"]

[project.scripts]
weather-agent = "weather_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
